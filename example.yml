template: Hello, %s!

defaultName: ${DW_DEFAULT_NAME:-Stranger}

# API authentication (HTTP Basic). Every /employee request must authenticate as one of these users.
# The server refuses to start unless EMPLOYEE_API_PASSWORD is set (min. 12 characters).
# Roles: READER may GET /employee, WRITER may GET and POST /employee.
# Secrets use literal block scalars (|-) so characters such as " #", ":" or quotes are kept verbatim.
auth:
  realm: employee-api
  users:
    - username: ${EMPLOYEE_API_USERNAME:-admin}
      password: |-
        ${EMPLOYEE_API_PASSWORD:-}
      roles: [READER, WRITER]

# Database settings.
database:

  # the name of your JDBC driver
  driverClass: org.h2.Driver

  # the username
  user: sa

  # the password
  password: sa

  # the JDBC URL
  url: jdbc:h2:./target/example

# use the simple server factory if you only want to run on a single port
#server:
#  type: simple
#  connector:
#    type: http
#    port: 8080

server:
#  softNofileLimit: 1000
#  hardNofileLimit: 1000
  # Basic credentials are only base64-encoded, so the API is served over HTTPS (8443).
  # Plain HTTP (8080) binds to loopback by default; only widen EMPLOYEE_HTTP_BIND_HOST
  # behind a TLS-terminating proxy. The server refuses to start without EMPLOYEE_KEYSTORE_PATH/PASSWORD.
  applicationConnectors:
    - type: https
      port: 8443
      keyStorePath: ${EMPLOYEE_KEYSTORE_PATH:-}
      keyStorePassword: |-
        ${EMPLOYEE_KEYSTORE_PASSWORD:-}
      # No trust store / client certs: skip Jetty's startup chain self-check and client-cert validation.
      # Clients still verify the server certificate as usual.
      validateCerts: false
      validatePeers: false
    - type: http
      bindHost: ${EMPLOYEE_HTTP_BIND_HOST:-127.0.0.1}
      port: 8080
    #this requires the alpn-boot library on the JVM's boot classpath
    #- type: h2
    #  port: 8445
    #  keyStorePath: example.keystore
    #  keyStorePassword: example
  adminConnectors:
    - type: http
      port: 8081
#    - type: https
#      port: 8444
#      keyStorePath: example.keystore
#      keyStorePassword: example

# Logging settings.
logging:

  # The default level of all loggers. Can be OFF, ERROR, WARN, INFO, DEBUG, TRACE, or ALL.
  level: INFO

  # Logger-specific levels.
  loggers:

    # Sets the level for 'com.example.app' to DEBUG.
    com.example.app: DEBUG

    # Redirects SQL logs to a separate file
    org.hibernate.SQL:
      level: DEBUG

# Logback's Time Based Rolling Policy - archivedLogFilenamePattern: /tmp/application-%d{yyyy-MM-dd}.log.gz
# Logback's Size and Time Based Rolling Policy -  archivedLogFilenamePattern: /tmp/application-%d{yyyy-MM-dd}-%i.log.gz
# Logback's Fixed Window Rolling Policy -  archivedLogFilenamePattern: /tmp/application-%i.log.gz

  appenders:
    - type: console
    - type: file
      threshold: INFO
      logFormat: "%-6level [%d{HH:mm:ss.SSS}] [%t] %logger{5} - %X{code} %msg %n"
      currentLogFilename: /tmp/application.log
      archivedLogFilenamePattern: /tmp/application-%d{yyyy-MM-dd}-%i.log.gz
      archivedFileCount: 7
      timeZone: UTC
      maxFileSize: 10MB

# the key needs to match the suffix of the renderer
viewRendererConfiguration:
    .ftl:
        strict_syntax: yes
        whitespace_stripping: yes

metrics:
  reporters:
    - type: graphite
      host: localhost
      port: 2003
      prefix: example
      frequency: 1m
