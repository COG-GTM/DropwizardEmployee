name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: HTTP parity against the Dropwizard 1.0.5 baseline
        run: |
          parity/capture.sh target/DropwizardEmployee-1.0.5.jar target/parity-ci
          diff -r parity/migrated target/parity-ci --exclude=jdk.info
